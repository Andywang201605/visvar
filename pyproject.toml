[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visvar"
version = "0.1.0"
description = "Simulate time-variable (periodic, pulsed, transient) sources in radio interferometer Measurement Sets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "astropy", "python-casacore"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
